<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>闪念 · 文舒</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<script src="../cordova.js"></script>
<script src="../js/boot.js"></script>
<style>
  html, body { width: 100%; min-height: 100%; }
  body { background: var(--paper); }
  .capture-paper { padding-top: 64px; padding-bottom: 80px; }

  .recent {
    margin-top: var(--s-7);
    border-top: 1px solid var(--paper-edge);
    padding-top: var(--s-5);
  }
  .recent h3 {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.32em;
    color: var(--ink-ghost);
    margin: 0 0 var(--s-3);
    text-transform: uppercase;
  }
  .recent-item {
    padding: var(--s-3) 0;
    border-bottom: 1px solid var(--paper-edge);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: start;
  }
  .recent-item:last-child { border-bottom: 0; }
  .recent-item .txt {
    font-family: var(--font-mincho);
    font-size: 14px;
    line-height: 1.85;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  .recent-item .meta-line {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    color: var(--ink-ghost);
    margin-top: 6px;
  }
  .recent-item .del {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--ink-ghost);
    cursor: pointer;
    background: transparent;
    border: 0;
  }
  .recent-item .del:hover { color: var(--vermilion); }

  .saved-flash {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--ink);
    color: var(--paper);
    padding: 8px 16px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
    z-index: 30;
  }
  .saved-flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <a class="ghost tl" href="library.html" data-back-fallback="library.html" aria-label="返回">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M8.5 2.5L4 7l4.5 4.5"/>
    </svg>
  </a>
  <button class="ghost tr" id="save-btn" aria-label="保存">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M3 7l3 3 5-6"/>
    </svg>
  </button>

  <div class="saved-flash" id="saved-flash">已 落 入 书 房</div>

  <div class="capture-paper">
    <div class="ctx">
      <span>闪 念</span>
      <span class="sep">/</span>
      <span>归 入 ·</span>
      <span id="ctx-novel" style="font-family:var(--font-mincho);text-transform:none;letter-spacing:0.06em;font-size:13px;color:var(--ink);">
        待 选
      </span>
    </div>

    <div class="prompt mincho">记 下 此 刻 的 念……</div>

    <div class="capture-input" contenteditable="true" id="input" data-placeholder="一个意象、一句对白、半段伏笔——丢进来，回头再认。"><span class="cursor-breath"></span></div>

    <div class="chip-bag" id="novel-chips"></div>

    <div class="chip-bag" id="tag-chips" style="margin-top: var(--s-3);">
      <button aria-selected="true" data-tag="灵感">灵 感</button>
      <button aria-selected="false" data-tag="伏笔">伏 笔</button>
      <button aria-selected="false" data-tag="修订">修 订</button>
      <button aria-selected="false" data-tag="人物">人 物</button>
      <button aria-selected="false" data-tag="对白">对 白</button>
    </div>

    <div class="capture-foot">
      <span id="foot-tag">○ 灵 感</span>
      <span id="foot-date"></span>
    </div>

    <div class="recent">
      <h3>书 房 里 的 闪 念</h3>
      <div id="recent-list"></div>
    </div>
  </div>

  <script type="module">
    import { listNovels, getCurrentNovel, addDraft, listDrafts, removeDraft } from '../js/store.js';
    import { $, $$, urlParam, toast, vibrate, requireApiKey, bindGlobalTapVibration, bindBackButtons } from '../js/utils.js';

    if (!requireApiKey()) throw new Error('redirected');
    bindGlobalTapVibration();
    bindBackButtons();

    const input = $('#input');
    setTimeout(() => input.focus(), 100);

    // 当前归属候选
    const novels = listNovels().filter((n) => ['writing', 'planning', 'validating'].includes(n.status));
    const current = (urlParam('novel') && novels.find((n) => n.id === urlParam('novel'))) || getCurrentNovel() || novels[0] || null;
    let selectedNovelId = current?.id || null;
    let selectedTag = '灵感';

    function renderNovelChips() {
      const wrap = $('#novel-chips');
      wrap.innerHTML = `<button data-id="" aria-selected="${!selectedNovelId}">无 归 处</button>` +
        novels.slice(0, 5).map((n) => `<button data-id="${n.id}" aria-selected="${n.id === selectedNovelId}">${n.title}</button>`).join('');
      wrap.querySelectorAll('button').forEach((b) => {
        b.onclick = () => {
          selectedNovelId = b.dataset.id || null;
          wrap.querySelectorAll('button').forEach((bb) => bb.setAttribute('aria-selected', bb.dataset.id === (selectedNovelId || '') ? 'true' : 'false'));
          $('#ctx-novel').textContent = selectedNovelId ? (novels.find((n) => n.id === selectedNovelId)?.title || '待 选') : '无 归 处';
        };
      });
      $('#ctx-novel').textContent = selectedNovelId ? (current?.title || '待 选') : '无 归 处';
    }
    renderNovelChips();

    $$('#tag-chips button').forEach((b) => {
      b.onclick = () => {
        selectedTag = b.dataset.tag;
        $$('#tag-chips button').forEach((bb) => bb.setAttribute('aria-selected', bb.dataset.tag === selectedTag ? 'true' : 'false'));
        $('#foot-tag').textContent = `○ ${selectedTag}`;
      };
    });

    // 时间
    function refreshDate() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      $('#foot-date').textContent = `${d.getFullYear()} / ${pad(d.getMonth() + 1)} / ${pad(d.getDate())} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    refreshDate();
    setInterval(refreshDate, 30 * 1000);

    function getText() {
      // 取出 contenteditable 的纯文本（不含光标占位的 span）
      const clone = input.cloneNode(true);
      clone.querySelectorAll('.cursor-breath').forEach((el) => el.remove());
      return clone.innerText.trim();
    }

    function save() {
      const text = getText();
      if (!text) { toast('还 没 写 内 容', 'error'); vibrate('warn'); return; }
      const novel = selectedNovelId ? novels.find((n) => n.id === selectedNovelId) : null;
      addDraft({
        text,
        tag: selectedTag,
        novelId: novel?.id || null,
        belongsTitle: novel?.title || '',
      });
      vibrate('ok');
      input.innerHTML = '<span class="cursor-breath"></span>';
      input.focus();
      renderRecent();
      const flash = $('#saved-flash');
      flash.classList.add('show');
      setTimeout(() => flash.classList.remove('show'), 1600);
    }

    $('#save-btn').onclick = save;

    // Cmd/Ctrl + Enter 保存
    input.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        save();
      }
    });

    function renderRecent() {
      const drafts = listDrafts().slice(0, 30);
      const list = $('#recent-list');
      if (!drafts.length) {
        list.innerHTML = `<p class="meta" style="text-align:center;padding: var(--s-4) 0; color: var(--ink-ghost);">书房里还没有闪念</p>`;
        return;
      }
      list.innerHTML = drafts.map((d) => {
        const t = new Date(d.createdAt).toLocaleString('zh-CN', { hour12: false });
        return `
          <div class="recent-item">
            <div>
              <div class="txt">${escapeHtml(d.text)}</div>
              <div class="meta-line">${d.tag || '灵感'} · ${d.belongsTitle || '无归处'} · ${t}</div>
            </div>
            <button class="del" data-id="${d.id}">扔 掉</button>
          </div>`;
      }).join('');
      list.querySelectorAll('.del').forEach((b) => {
        b.onclick = () => { removeDraft(b.dataset.id); renderRecent(); };
      });
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    renderRecent();
  </script>
</body>
</html>
