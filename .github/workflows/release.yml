name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Build web package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package web dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="wenshu-web-${VERSION:-manual}.zip"
          cd dist
          zip -r "../${ARCHIVE}" .
          cd ..
          echo "WEB_ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenshu-web
          path: ${{ env.WEB_ARCHIVE }}
          if-no-files-found: error

  android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    needs: web
    if: ${{ vars.BUILD_ANDROID == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required when BUILD_ANDROID=true" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Create Android build config
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is required when BUILD_ANDROID=true" >&2
              exit 1
            fi
          done
          cat > build.android.json <<EOF
          {
            "android": {
              "release": {
                "keystore": "release.keystore",
                "storePassword": "${ANDROID_KEYSTORE_PASSWORD}",
                "alias": "${ANDROID_KEY_ALIAS}",
                "password": "${ANDROID_KEY_PASSWORD}",
                "keystoreType": ""
              }
            }
          }
          EOF

      - name: Add Android platform
        run: npx cordova platform add android@13.0.0

      - name: Build release APK
        run: npx cordova build android --release --packageType=apk --buildConfig=build.android.json

      - name: Collect APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          find platforms/android/app/build/outputs -maxdepth 5 -type f | sort
          APK="$(find platforms/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          cp "$APK" "release-artifacts/wenshu-android-${VERSION:-manual}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenshu-android
          path: release-artifacts/*.apk
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - web
      - android
    if: ${{ always() && needs.web.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('文舒 {0}', github.ref_name) || format('文舒 manual build {0}', github.run_number) }}
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
