<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>谋篇 · 文舒</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<script type="module" src="../js/boot.js"></script>
<style>
  html, body { width: 100%; min-height: 100%; }
  body { background: var(--paper); }
  .plan { max-width: 720px; margin: 0 auto; }
  .sect-title {
    font-family: var(--font-mincho);
    font-size: 13px;
    letter-spacing: 0.22em;
    color: var(--ink-ghost);
    margin: var(--s-8) 0 var(--s-4);
    display: flex; align-items: center; gap: 12px;
  }
  .sect-title::before, .sect-title::after { content: ""; flex: 1; height: 1px; background: var(--paper-edge); }
  .sect-title .action {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--vermilion);
    cursor: pointer;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--vermilion);
  }
  .summary-card {
    border: 1px solid var(--paper-edge);
    padding: var(--s-5);
    display: grid; grid-template-columns: 60px 1fr;
    gap: 8px var(--s-4);
    font-family: var(--font-mincho);
    font-size: 13.5px;
    line-height: 1.85;
  }
  .summary-card dt { color: var(--ink-ghost); letter-spacing: 0.08em; }
  .summary-card dd { margin: 0; color: var(--ink); letter-spacing: 0.02em; }
  .summary-card dd b { font-weight: 500; }

  .outline-row.editable .ti {
    border-bottom: 1px dashed transparent;
    transition: border-color .15s ease;
  }
  .outline-row.editable .ti:hover {
    border-bottom-color: var(--paper-edge);
  }
  .outline-row .ti[contenteditable="true"]:focus {
    outline: none;
    border-bottom-color: var(--ink);
  }

  .gen-banner {
    text-align: center;
    padding: var(--s-6) var(--s-5);
    font-family: var(--font-mincho);
    font-size: 14px;
    line-height: 2;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    border: 1px dashed var(--paper-edge);
  }
  .gen-banner .glyph {
    font-size: 22px;
    color: var(--ink-ghost);
    margin-bottom: var(--s-3);
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
  <a class="ghost tl" href="library.html" data-back-fallback="library.html" aria-label="返回">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M8.5 2.5L4 7l4.5 4.5"/>
    </svg>
  </a>
  <a class="ghost tr" href="settings.html" aria-label="设置">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </a>

  <div class="plan" id="plan-wrap">
    <div class="stepper" aria-label="创作阶段">
      <span class="dot on"></span><span>立项</span>
      <span class="line"></span>
      <span class="dot now"></span><span>谋篇</span>
      <span class="line"></span>
      <span class="dot"></span><span>开笔</span>
    </div>

    <header>
      <h1 id="novel-title">《载入中…》</h1>
      <p class="lede" id="novel-logline" style="margin-top:14px"></p>
    </header>

    <!-- 立项摘要 -->
    <div>
      <div class="sect-title">立 项 · 已 收 集</div>
      <dl class="summary-card" id="spec-summary"></dl>
    </div>

    <!-- 大纲 -->
    <div>
      <div class="sect-title">
        大 纲
        <span class="action" id="regen-outline" style="display:none;">重 新 生 成</span>
      </div>
      <div id="outline-wrap"></div>
    </div>

    <!-- 人物 -->
    <div>
      <div class="sect-title">
        人 物 档 案
        <span class="action" id="regen-chars" style="display:none;">重 新 生 成</span>
      </div>
      <div id="chars-wrap"></div>
    </div>

    <!-- 写作模式 -->
    <div id="mode-wrap" style="display:none;">
      <div class="sect-title">写 作 模 式</div>
      <div class="modes" id="mode-seg">
        <button data-v="serial" aria-selected="true">
          <span class="mode-name">逐章串行</span>
          <span class="mode-sub">SERIAL · 稳</span>
        </button>
        <button data-v="subagent-parallel" aria-selected="false">
          <span class="mode-name">子 Agent 并行</span>
          <span class="mode-sub">PARALLEL · 快</span>
        </button>
        <button data-v="agent-teams" aria-selected="false">
          <span class="mode-name">Teams 协作</span>
          <span class="mode-sub">TEAMS · 多人</span>
        </button>
      </div>
      <p style="font-family:var(--font-mincho);font-size:13px;line-height:1.85; color:var(--ink-faint);margin: var(--s-4) 0 0;letter-spacing:0.02em;" id="mode-hint"></p>
    </div>

    <div class="btn-row" style="justify-content:flex-end;padding-top:var(--s-7); display:none;" id="action-row">
      <a href="#" class="btn-quiet" id="back-edit" style="border-color:var(--paper-edge);color:var(--ink-faint);">修 改 设 置</a>
      <a href="#" class="btn-quiet vermilion" id="start-writing">开 笔 · 第 一 章</a>
    </div>

    <p class="meta" style="text-align:center;padding-top:var(--s-5);">
      02 - 写作计划 · json · 自动同步
    </p>
  </div>

  <script type="module">
    import { getNovel, updateNovel, getPrefs } from '../js/store.js';
    import { outlinePrompt, charactersPrompt } from '../js/prompts.js';
    import { chat, stream, parseJson } from '../js/deepseek.js';
    import { toast, $, $$, urlParam, vibrate, requireApiKey, bindGlobalTapVibration, bindBackButtons } from '../js/utils.js';

    if (!requireApiKey()) throw new Error('redirected');
    bindGlobalTapVibration();
    bindBackButtons();

    const novelId = urlParam('novel');
    let novel = novelId ? getNovel(novelId) : null;
    if (!novel) {
      document.querySelector('.plan').innerHTML = `
        <div class="empty-state">
          <div class="glyph mincho">空</div>
          <p class="hint">没有找到这部小说。</p>
          <a class="btn-quiet" href="library.html">回 到 书 房</a>
        </div>`;
      throw new Error('no novel');
    }

    // 头部
    document.title = `谋篇 · ${novel.title}`;
    $('#novel-title').textContent = `《${novel.title}》`;
    $('#novel-logline').textContent = novel.spec?.logline || novel.spec?.creative || '';

    // 立项摘要
    function renderSpec() {
      const s = novel.spec || {};
      const rows = [
        ['题材', s.genre],
        ['创意', s.creative],
        ['主角', [s.protagonist, s.career].filter(Boolean).join(' · ')],
        ['性格', s.personality],
        ['冲突', s.conflict],
        ['驱动力', s.drive],
        ['世界观', s.world],
        ['视角', s.viewpoint],
        ['基调', s.tone],
        ['主题', s.theme],
        ['规模', `${s.chapters || 15} 章 · 约 ${((s.chapters || 15) * 0.4).toFixed(1)} 万字`]
      ].filter(([k, v]) => v);
      $('#spec-summary').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    }
    renderSpec();

    // 大纲渲染
    function renderOutline() {
      const w = $('#outline-wrap');
      if (!novel.outline?.length) {
        w.innerHTML = `<div class="gen-banner">
          <div class="glyph mincho">纲</div>
          大纲尚未生成。<br>需要先听 AI 把 ${novel.spec?.chapters || 15} 章的骨架搭起来。
          <div style="margin-top: var(--s-4);"><button class="btn-quiet vermilion" id="gen-outline-btn">让 AI 起 草 大 纲</button></div>
        </div>`;
        $('#gen-outline-btn').onclick = generateOutline;
        $('#regen-outline').style.display = 'none';
        return;
      }
      w.innerHTML = `<div class="outline" id="outline-list">
        ${novel.outline.map((r) => `
          <div class="outline-row editable">
            <span class="ch">${String(r.n).padStart(2, '0')}</span>
            <div class="ti" contenteditable="true" data-n="${r.n}" data-f="title">${r.title || '未命名'}
              <span class="ev" contenteditable="true" data-n="${r.n}" data-f="event">${r.event || ''}</span>
            </div>
            <span class="wc">钩 · ${(r.hook || '').slice(0, 6) || '—'}</span>
          </div>
        `).join('')}
      </div>`;
      $$('[contenteditable]', w).forEach((el) => {
        el.onblur = () => {
          const n = +el.dataset.n;
          const f = el.dataset.f;
          const v = el.innerText.split('\n')[0].trim();
          const row = novel.outline.find((r) => r.n === n);
          if (row) {
            row[f] = v;
            updateNovel(novel.id, { outline: novel.outline });
          }
        };
      });
      $('#regen-outline').style.display = 'inline-block';
      $('#regen-outline').onclick = generateOutline;
    }

    function renderCharacters() {
      const w = $('#chars-wrap');
      if (!novel.characters?.length) {
        w.innerHTML = `<div class="gen-banner">
          <div class="glyph mincho">人</div>
          人物档案尚未生成。<br>AI 会基于大纲拟主角、配角、说话风格、致命缺陷。
          <div style="margin-top: var(--s-4);"><button class="btn-quiet vermilion" id="gen-chars-btn">让 AI 写 角 色</button></div>
        </div>`;
        $('#gen-chars-btn').onclick = generateCharacters;
        $('#regen-chars').style.display = 'none';
        return;
      }
      w.innerHTML = novel.characters.map((c, i) => `
        <div class="char-card" ${i === novel.characters.length - 1 ? 'style="border-bottom:0;"' : ''}>
          <div class="name">${c.name} <span class="role">${c.role || '角色'}</span></div>
          <dl>
            ${c.core ? `<dt>核心</dt><dd>${c.core}</dd>` : ''}
            ${c.fatal ? `<dt>致命</dt><dd>${c.fatal}</dd>` : ''}
            ${c.speech ? `<dt>口头</dt><dd>${c.speech}</dd>` : ''}
            ${c.fear ? `<dt>恐惧</dt><dd>${c.fear}</dd>` : ''}
            ${c.relations ? `<dt>关系</dt><dd>${c.relations}</dd>` : ''}
          </dl>
        </div>
      `).join('');
      $('#regen-chars').style.display = 'inline-block';
      $('#regen-chars').onclick = generateCharacters;
    }

    // 用 stream() 走流式，让用户看到进度（已收字数 + 用时）
    // 返回最终完整文本；onProgress 内部更新 banner UI
    async function streamWithProgress(messages, opts, banner, label) {
      const start = Date.now();
      let timer;
      function fmt(full) {
        const sec = Math.round((Date.now() - start) / 1000);
        const cn = [...full].length;
        return `<div class="ai-banner"><span class="glyph"></span>
          <div style="display:flex; flex-direction:column; gap:4px;">
            <span>${label}</span>
            <span style="font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; color: var(--ink-ghost);">已 收 ${cn} 字 · 已 用 ${sec} 秒</span>
          </div>
        </div>`;
      }
      banner.innerHTML = fmt('');
      // 每 0.5s 刷新一次时间显示，避免 chunk 间隔过大导致用户以为卡了
      let lastFull = '';
      timer = setInterval(() => { banner.innerHTML = fmt(lastFull); }, 500);
      try {
        const full = await stream(messages, opts, (_delta, fullText) => {
          lastFull = fullText;
          banner.innerHTML = fmt(fullText);
        });
        return full;
      } finally {
        clearInterval(timer);
      }
    }

    async function generateOutline() {
      vibrate('start');
      const banner = $('#outline-wrap');
      try {
        const reply = await streamWithProgress(
          outlinePrompt(novel.spec, novel.spec?.chapters || 15),
          { temperature: 0.85, jsonMode: true },
          banner,
          `AI 正在排 ${novel.spec?.chapters || 15} 章大纲…`
        );
        const parsed = parseJson(reply);
        if (!parsed?.chapters?.length) throw new Error('AI 未返回有效大纲');
        const outline = parsed.chapters.map((c) => ({
          n: c.n,
          title: c.title || `第${c.n}章`,
          event: c.event || '',
          prev: c.prev || '',
          hook: c.hook || '',
          characters: c.characters || [],
          scene: c.scene || ''
        }));
        // 初始化章节状态
        const chapters = outline.map((r) => ({
          n: r.n, title: r.title, status: 'pending', body: '', wordCount: 0, hook: r.hook
        }));
        novel = updateNovel(novel.id, { outline, chapters });
        renderOutline();
        renderActions();
        vibrate('done');
        toast('大 纲 已 备 好', 'success');
      } catch (e) {
        banner.innerHTML = `<div class="ai-banner error"><span class="glyph"></span><span>大纲生成失败：${e.message}</span></div>
        <div style="margin-top: var(--s-4);"><button class="btn-quiet" id="gen-outline-btn">重 试</button></div>`;
        $('#gen-outline-btn').onclick = generateOutline;
        vibrate('warn');
      }
    }

    async function generateCharacters() {
      if (!novel.outline?.length) { toast('请先生成大纲', 'error'); vibrate('warn'); return; }
      vibrate('start');
      const banner = $('#chars-wrap');
      try {
        const reply = await streamWithProgress(
          charactersPrompt(novel.spec, novel.outline),
          { temperature: 0.85, jsonMode: true },
          banner,
          'AI 正在拟主角、配角…'
        );
        const parsed = parseJson(reply);
        if (!parsed?.characters?.length) throw new Error('AI 未返回有效人物');
        novel = updateNovel(novel.id, { characters: parsed.characters });
        renderCharacters();
        renderActions();
        vibrate('done');
        toast('人 物 档 案 已 备 好', 'success');
      } catch (e) {
        banner.innerHTML = `<div class="ai-banner error"><span class="glyph"></span><span>人物生成失败：${e.message}</span></div>
        <div style="margin-top: var(--s-4);"><button class="btn-quiet" id="gen-chars-btn">重 试</button></div>`;
        $('#gen-chars-btn').onclick = generateCharacters;
        vibrate('warn');
      }
    }

    function renderActions() {
      const ready = !!(novel.outline?.length && novel.characters?.length);
      $('#mode-wrap').style.display = ready ? 'block' : 'none';
      $('#action-row').style.display = ready ? 'flex' : 'none';

      if (!ready) return;

      // 写作模式
      let mode = novel.mode || getPrefs().defaultMode;
      $('#mode-seg').querySelectorAll('button').forEach((b) => {
        b.setAttribute('aria-selected', b.dataset.v === mode ? 'true' : 'false');
        b.onclick = () => {
          mode = b.dataset.v;
          $('#mode-seg').querySelectorAll('button').forEach((bb) => bb.setAttribute('aria-selected', bb.dataset.v === mode ? 'true' : 'false'));
          novel = updateNovel(novel.id, { mode });
          renderModeHint();
        };
      });
      renderModeHint();
      function renderModeHint() {
        const n = novel.spec?.chapters || 15;
        const hints = {
          serial: `${n} 章逐章串行——慢一点，但每章的钩子衔接最稳。`,
          'subagent-parallel': `${n} 章分批并行——总耗时短，但需 AI 多轮校对衔接，浏览器会同时跑多个流。`,
          'agent-teams': `Teams 协作模式——多个 AI 角色协同（编辑/小说家/校对），仍在试验。`
        };
        $('#mode-hint').innerHTML = hints[mode] || '';
      }

      $('#back-edit').onclick = (e) => {
        e.preventDefault();
        toast('设定修改请回到立项问答 onboard 重做');
      };
      $('#start-writing').onclick = (e) => {
        e.preventDefault();
        vibrate('ok');
        const firstUnfinished = novel.chapters.find((c) => c.status !== 'completed') || novel.chapters[0];
        const n = firstUnfinished?.n || 1;
        updateNovel(novel.id, { status: 'writing', currentChapter: n });
        location.href = `editor.html?novel=${novel.id}&ch=${n}`;
      };
    }

    renderOutline();
    renderCharacters();
    renderActions();
  </script>
</body>
</html>
