<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>落墨 · 文舒</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<script type="module" src="../js/boot.js"></script>
<style>
  html, body { width: 100%; min-height: 100%; }
  body { background: var(--paper-deep); }
  .export-stage {
    padding: 56px 18px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--s-5);
    max-width: 760px;
    margin: 0 auto;
  }
  .ex-kicker {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--ink-ghost);
    text-transform: uppercase;
  }
  .ex-kicker b { color: var(--ink); font-weight: 500; letter-spacing: 0.18em; }

  .export-card {
    position: relative;
    width: min(360px, 100%);
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    padding: 36px 28px 24px;
    overflow: hidden;
    min-height: 420px;
  }
  .watermark {
    position: absolute;
    right: -8px; bottom: -28px;
    font-size: 160px;
    line-height: 1;
    color: var(--paper-edge);
    opacity: 0.55;
    user-select: none;
    pointer-events: none;
    letter-spacing: -0.04em;
  }
  .ec-kicker {
    font-family: var(--font-mincho);
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--ink-ghost);
    text-align: center;
    margin-bottom: 14px;
  }
  .ec-title {
    font-family: var(--font-mincho);
    font-size: 26px;
    letter-spacing: 0.12em;
    line-height: 1.3;
    color: var(--ink);
    text-align: center;
    margin: 0 0 4px;
    font-weight: 500;
  }
  .ec-subtitle {
    font-family: var(--font-mincho);
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--ink-faint);
    text-align: center;
    margin: 0 0 24px;
  }
  .ec-rule {
    width: 36px; height: 1px;
    background: var(--ink-ghost);
    margin: 0 auto 22px;
    opacity: 0.6;
  }
  .ec-body {
    font-family: var(--font-mincho);
    font-size: 14.5px;
    line-height: 2;
    color: var(--ink);
    letter-spacing: 0.04em;
    text-align: justify;
    max-height: 280px;
    overflow: hidden;
    position: relative;
  }
  .ec-body::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(transparent, var(--paper));
    pointer-events: none;
  }
  .ec-body p { margin: 0 0 12px; text-indent: 2em; }
  .ec-body p.lead { text-indent: 0; font-style: italic; color: var(--ink-faint); text-align: center; }
  .ec-body blockquote {
    margin: 0 0 12px;
    padding-left: 14px;
    border-left: 2px solid var(--paper-edge);
    color: var(--ink-faint);
    font-style: italic;
    text-indent: 0;
  }
  .ec-foot {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--paper-edge);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mincho);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--ink-faint);
    position: relative;
    z-index: 2;
  }
  .ec-seal-wrap { display: inline-flex; align-items: center; gap: 10px; }
  .ec-seal {
    width: 28px; height: 28px;
    background: var(--vermilion);
    color: var(--paper);
    display: inline-grid; place-items: center;
    font-family: var(--font-mincho);
    font-size: 13px;
    letter-spacing: -0.04em;
  }

  .scope-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .scope-row .scope-pick {
    display: flex; gap: 0;
    width: min(360px, 100%);
    border: 1px solid var(--paper-edge);
    background: var(--paper);
  }
  .scope-pick button {
    flex: 1;
    padding: 10px 0;
    font-family: var(--font-mincho);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    border-right: 1px solid var(--paper-edge);
    background: transparent;
    cursor: pointer;
  }
  .scope-pick button:last-child { border-right: 0; }
  .scope-pick button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .format-row {
    display: flex; gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-ghost);
  }
  .format-row button {
    padding: 6px 14px;
    border: 1px solid var(--paper-edge);
    background: var(--paper);
    color: var(--ink-faint);
    cursor: pointer;
  }
  .format-row button[aria-pressed="true"] {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }

  .ch-picker {
    width: min(360px, 100%);
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    padding: var(--s-4);
    max-height: 220px;
    overflow-y: auto;
  }
  .ch-picker .ch-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 4px;
    cursor: pointer;
    border-bottom: 1px solid var(--paper-edge);
    font-family: var(--font-mincho);
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .ch-picker .ch-row:last-child { border-bottom: 0; }
  .ch-picker .ch-row:hover { background: var(--paper-deep); }
  .ch-picker .ch-row[aria-selected="true"] { color: var(--vermilion); }
  .ch-picker .ch-row .num { font-family: var(--font-mono); font-size: 10px; color: var(--ink-ghost); letter-spacing: 0.18em; }
  .ch-picker .ch-row.pending { color: var(--ink-ghost); }

  .export-bottom {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: var(--s-5) var(--s-5) var(--s-7);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mincho);
    font-size: 14px;
    flex-wrap: wrap;
    gap: var(--s-3);
  }
  .export-bottom .primary {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--ink);
    border-bottom: 1px solid var(--ink);
    padding-bottom: 4px;
    letter-spacing: 0.06em;
    cursor: pointer;
    background: transparent;
    border-top: 0; border-left: 0; border-right: 0;
    font-family: var(--font-mincho);
    font-size: 14px;
  }
  .export-bottom .primary.vermilion {
    color: var(--vermilion);
    border-bottom-color: var(--vermilion);
  }
  .export-bottom .quiet { color: var(--ink-ghost); }

  .stats {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-ghost);
    text-align: center;
  }
</style>
</head>
<body>
  <a class="ghost tl" href="library.html" data-back-fallback="library.html" aria-label="返回">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M8.5 2.5L4 7l4.5 4.5"/>
    </svg>
  </a>

  <div class="export-stage">
    <div class="ex-kicker" id="ex-kicker">载 入 中</div>

    <article class="export-card" id="card">
      <div class="watermark mincho" aria-hidden="true">文</div>
      <div class="ec-kicker" id="ec-kicker"></div>
      <h2 class="ec-title" id="ec-title">…</h2>
      <div class="ec-subtitle" id="ec-subtitle"></div>
      <div class="ec-rule"></div>
      <div class="ec-body" id="ec-body"></div>
      <div class="ec-foot">
        <span id="ec-date">二〇二六</span>
        <span class="ec-seal-wrap">
          <span id="ec-byline">文 舒 · 著</span>
          <span class="ec-seal" id="ec-seal">文</span>
        </span>
      </div>
    </article>

    <div class="scope-row">
      <div class="scope-pick" id="scope">
        <button data-v="chapter" aria-pressed="true">本 章</button>
        <button data-v="book" aria-pressed="false">全 书</button>
        <button data-v="hooks" aria-pressed="false">钩 子 集</button>
        <button data-v="plan" aria-pressed="false">计 划 包</button>
      </div>
    </div>

    <div id="ch-picker-wrap" class="ch-picker" style="display:none;">
      <div id="ch-list"></div>
    </div>

    <div class="format-row" id="format">
      <button data-v="md" aria-pressed="true">MD</button>
      <button data-v="txt" aria-pressed="false">TXT</button>
      <button data-v="json" aria-pressed="false">JSON</button>
    </div>

    <div class="stats" id="stats"></div>
  </div>

  <div class="export-bottom">
    <span class="quiet meta">WENSHU · 落墨</span>
    <button class="primary vermilion mincho" id="export-btn">导 出 · 存 入 卷 宗</button>
  </div>

  <script type="module">
    import { getNovel, exportNovelMd } from '../js/store.js';
    import { $, $$, urlParam, download, timestamp, chCn, cnWordCount, vibrate, bindGlobalTapVibration, bindBackButtons } from '../js/utils.js';

    bindGlobalTapVibration();
    bindBackButtons();

    const novelId = urlParam('novel');
    const novel = novelId ? getNovel(novelId) : null;

    if (!novel) {
      document.querySelector('.export-stage').innerHTML = `
        <div class="empty-state" style="background: var(--paper); width: 100%; padding: var(--s-7);">
          <div class="glyph mincho">空</div>
          <p class="hint">没有找到这部小说。</p>
          <a class="btn-quiet" href="library.html">回 到 书 房</a>
        </div>`;
      throw new Error('no novel');
    }

    let scope = 'chapter';
    let format = 'md';
    let chosenChN = (novel.chapters.find((c) => c.body && c.status !== 'completed') || novel.chapters.find((c) => c.body) || novel.chapters[0])?.n || 1;

    function selectedChapter() {
      return novel.chapters.find((c) => c.n === chosenChN) || novel.chapters[0];
    }

    function renderPreview() {
      const wc = (novel.chapters || []).reduce((s, c) => s + (c.wordCount || 0), 0);

      $('#ex-kicker').innerHTML = `<b>《${novel.title}》</b> &nbsp;·&nbsp; ${scope === 'chapter' ? `第 ${String(chosenChN).padStart(2, '0')} 章` : (scope === 'book' ? '全 书' : (scope === 'hooks' ? '钩 子 集' : '计 划 包'))}`;

      if (scope === 'chapter') {
        const ch = selectedChapter();
        $('#ec-kicker').textContent = `${novel.title} · 第 ${chCn(chosenChN)} 章`;
        $('#ec-title').textContent = ch?.title || '未命名';
        $('#ec-subtitle').textContent = ch?.scored?.verdict === 'pass' ? '已 校 验' : (ch?.status === 'completed' ? '已 封 缄' : '· 草 ·');
        renderBodyPreview(ch?.body || '本章尚未落笔。');
        $('#ec-seal').textContent = chCn(chosenChN);
        $('#ec-byline').textContent = `${novel.spec?.protagonist || '文舒'} · 著`;
        $('#stats').textContent = `本章 ${(ch?.wordCount || 0).toLocaleString()} 字`;
      } else if (scope === 'book') {
        $('#ec-kicker').textContent = novel.title;
        $('#ec-title').textContent = `《${novel.title}》`;
        $('#ec-subtitle').textContent = novel.spec?.genre || '';
        const intro = (novel.spec?.synopsis || novel.spec?.logline || novel.spec?.creative || '').slice(0, 400);
        renderBodyPreview(intro || '（暂无概述）');
        $('#ec-seal').textContent = '全';
        $('#ec-byline').textContent = `${novel.spec?.protagonist || '文舒'} · 著`;
        const completed = novel.chapters.filter((c) => c.status === 'completed').length;
        $('#stats').textContent = `${novel.chapters.length} 章 · ${wc.toLocaleString()} 字 · 完结 ${completed}`;
      } else if (scope === 'hooks') {
        $('#ec-kicker').textContent = novel.title;
        $('#ec-title').textContent = '钩 子 集';
        $('#ec-subtitle').textContent = '章 末 悬 念 集 录';
        const hooks = novel.chapters.filter((c) => c.hook).slice(0, 6).map((c) => `第${c.n}章 · ${c.hook}`).join('\n\n');
        renderBodyPreview(hooks || '（暂无钩子）');
        $('#ec-seal').textContent = '钩';
        $('#ec-byline').textContent = `${novel.chapters.filter((c) => c.hook).length} 条钩子`;
        $('#stats').textContent = `${novel.chapters.filter((c) => c.hook).length} 条钩子`;
      } else if (scope === 'plan') {
        $('#ec-kicker').textContent = novel.title;
        $('#ec-title').textContent = '计 划 包';
        $('#ec-subtitle').textContent = '大 纲 · 人 物 · 章 节';
        const lines = [
          `题材：${novel.spec?.genre || '-'}`,
          `主角：${novel.spec?.protagonist || '-'} · ${novel.spec?.career || ''}`,
          `规模：${novel.outline?.length || 0} 章 · ${wc.toLocaleString()} 字`,
          `已完成：${novel.chapters.filter((c) => c.status === 'completed').length} 章`
        ];
        renderBodyPreview(lines.join('\n'));
        $('#ec-seal').textContent = '计';
        $('#ec-byline').textContent = `${novel.outline?.length || 0} 章 · 计划`;
        $('#stats').textContent = `导出后会得到 plan.json + outline.md + characters.md + 全部章节`;
      }
    }

    function renderBodyPreview(text) {
      const html = text.split(/\n+/).filter(Boolean).map((line) => {
        if (line.startsWith('> ')) return `<p class="lead">${line.slice(2)}</p>`;
        return `<p>${line}</p>`;
      }).join('');
      $('#ec-body').innerHTML = html;
    }

    function renderChPicker() {
      const wrap = $('#ch-picker-wrap');
      if (scope !== 'chapter') { wrap.style.display = 'none'; return; }
      wrap.style.display = 'block';
      const html = (novel.outline?.length ? novel.outline : novel.chapters).map((r) => {
        const ch = novel.chapters.find((c) => c.n === r.n);
        const wc = ch?.wordCount || 0;
        const hasBody = wc > 50;
        return `
          <div class="ch-row ${hasBody ? '' : 'pending'}" data-n="${r.n}" aria-selected="${r.n === chosenChN ? 'true' : 'false'}">
            <span><span class="num">${String(r.n).padStart(2, '0')}</span> ${r.title || ch?.title || '未命名'}</span>
            <span class="num">${hasBody ? wc + ' 字' : '未写'}</span>
          </div>`;
      }).join('');
      $('#ch-list').innerHTML = html;
      $$('#ch-list .ch-row').forEach((row) => {
        row.onclick = () => {
          chosenChN = +row.dataset.n;
          $$('#ch-list .ch-row').forEach((r) => r.setAttribute('aria-selected', r.dataset.n == chosenChN ? 'true' : 'false'));
          renderPreview();
        };
      });
    }

    function renderFormatAvail() {
      // hooks/plan 强制 md/json
      $$('#format button').forEach((b) => {
        const v = b.dataset.v;
        let disabled = false;
        if (scope === 'plan' && v === 'txt') disabled = true;
        b.style.opacity = disabled ? '0.3' : '';
        b.disabled = disabled;
      });
    }

    $$('#scope button').forEach((b) => {
      b.onclick = () => {
        scope = b.dataset.v;
        $$('#scope button').forEach((bb) => bb.setAttribute('aria-pressed', bb.dataset.v === scope ? 'true' : 'false'));
        renderChPicker();
        renderFormatAvail();
        renderPreview();
      };
    });
    $$('#format button').forEach((b) => {
      b.onclick = () => {
        if (b.disabled) return;
        format = b.dataset.v;
        $$('#format button').forEach((bb) => bb.setAttribute('aria-pressed', bb.dataset.v === format ? 'true' : 'false'));
      };
    });

    function safeName(s) { return (s || '').replace(/[\/\\?%*:|"<>]/g, '·').trim(); }

    function doExport() {
      const ts = timestamp();
      const base = safeName(novel.title) || 'novel';

      if (scope === 'chapter') {
        const ch = selectedChapter();
        if (!ch || !ch.body) { alert('本章尚无正文。'); return; }
        const filename = `${base}-第${String(ch.n).padStart(2, '0')}章-${safeName(ch.title)}-${ts}`;
        if (format === 'md') {
          const md = `# 第${ch.n}章 · ${ch.title}\n\n${ch.body}\n\n---\n章末钩：${ch.hook || ''}\n字数：${ch.wordCount || cnWordCount(ch.body)}\n`;
          download(filename + '.md', md, 'text/markdown;charset=utf-8');
        } else if (format === 'txt') {
          const txt = `第${ch.n}章 · ${ch.title}\n\n${ch.body.replace(/^> /gm, '“')}\n`;
          download(filename + '.txt', txt);
        } else {
          download(filename + '.json', JSON.stringify({ chapter: ch, novelTitle: novel.title }, null, 2), 'application/json');
        }
      } else if (scope === 'book') {
        if (format === 'md' || format === 'txt') {
          let all = `# 《${novel.title}》\n\n`;
          if (novel.spec?.logline) all += `> ${novel.spec.logline}\n\n`;
          if (novel.spec?.synopsis) all += `## 故事概述\n\n${novel.spec.synopsis}\n\n`;
          for (const ch of novel.chapters.filter((c) => c.body)) {
            all += `\n## 第${ch.n}章 · ${ch.title || ''}\n\n${ch.body}\n\n`;
          }
          const ext = format === 'md' ? '.md' : '.txt';
          download(`${base}-全书-${ts}${ext}`, all, format === 'md' ? 'text/markdown;charset=utf-8' : 'text/plain');
        } else {
          download(`${base}-全书-${ts}.json`, JSON.stringify(novel, null, 2), 'application/json');
        }
      } else if (scope === 'hooks') {
        const hooks = novel.chapters.filter((c) => c.hook);
        if (format === 'md') {
          let md = `# 《${novel.title}》· 钩子集\n\n`;
          for (const c of hooks) md += `## 第${c.n}章 · ${c.title || ''}\n\n${c.hook}\n\n`;
          download(`${base}-钩子集-${ts}.md`, md, 'text/markdown;charset=utf-8');
        } else if (format === 'txt') {
          const txt = hooks.map((c) => `第${c.n}章 · ${c.title}\n${c.hook}\n`).join('\n');
          download(`${base}-钩子集-${ts}.txt`, txt);
        } else {
          download(`${base}-钩子集-${ts}.json`, JSON.stringify(hooks.map((c) => ({ n: c.n, title: c.title, hook: c.hook })), null, 2), 'application/json');
        }
      } else if (scope === 'plan') {
        const files = exportNovelMd(novel.id);
        if (!files) return;
        if (format === 'json') {
          // 单 JSON：完整 plan
          const plan = JSON.parse(files['02-写作计划.json']);
          download(`${base}-计划包-${ts}.json`, JSON.stringify(plan, null, 2), 'application/json');
        } else {
          // 多文件 md：依次触发下载
          Object.entries(files).forEach(([name, content], i) => {
            setTimeout(() => {
              const isJson = name.endsWith('.json');
              download(`${base}/${name}`, content, isJson ? 'application/json' : 'text/markdown;charset=utf-8');
            }, i * 200);
          });
        }
      }
    }

    $('#export-btn').onclick = () => { vibrate('ok'); doExport(); };

    renderChPicker();
    renderFormatAvail();
    renderPreview();
  </script>
</body>
</html>
