<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>书房 · 文舒</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<script type="module" src="../js/boot.js"></script>
<style>
  html, body { width: 100%; min-height: 100%; }
  body { background: var(--paper); }
  .library-wrap { max-width: 760px; margin: 0 auto; padding-top: 56px; }
  .lib-tabs { padding-left: var(--s-5); padding-right: var(--s-5); }
  .lib-tabs button { background: transparent; cursor: pointer; }

  /* 顶栏：让 .ghost.tl/.tr 不再压住标题 */
  .library-head.mobile {
    padding: var(--s-3) var(--s-5) 0;
    display: block;
  }
  .library-head .greet {
    font-size: 22px;
    letter-spacing: 0.18em;
    color: var(--ink);
  }

  .drift-action {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 6;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
    color: var(--ink-ghost);
    text-decoration: none;
  }
  .drift-action .glyph {
    font-family: var(--font-mincho);
    font-size: 22px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 1px solid var(--paper-edge);
    border-radius: 50%;
    color: var(--ink);
    background: var(--paper);
    transition: background .2s ease, color .2s ease;
  }
  .drift-action:hover .glyph { background: var(--ink); color: var(--paper); }
  .drift-action .lbl {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-ghost);
  }

  .card-actions {
    display: flex; gap: 14px;
    margin-top: var(--s-3);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-ghost);
  }
  .card-actions a {
    color: var(--ink-faint);
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    text-decoration: none;
  }
  .card-actions a:hover { color: var(--ink); border-bottom-color: var(--ink); }
  .card-actions a.danger:hover { color: var(--vermilion); border-bottom-color: var(--vermilion); }
</style>
</head>
<body class="library-page">
  <a class="ghost tl" href="index.html" aria-label="入口">
    <svg width="14" height="14" viewBox="0 0 14 14"><g fill="currentColor">
      <circle cx="2" cy="2" r="1"/><circle cx="7" cy="2" r="1"/><circle cx="12" cy="2" r="1"/>
      <circle cx="2" cy="7" r="1"/><circle cx="7" cy="7" r="1"/><circle cx="12" cy="7" r="1"/>
      <circle cx="2" cy="12" r="1"/><circle cx="7" cy="12" r="1"/><circle cx="12" cy="12" r="1"/>
    </g></svg>
  </a>
  <a class="ghost tr" href="settings.html" aria-label="设置">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </a>

  <div class="library-wrap">
    <header class="library-head mobile">
      <div class="greet mincho">文 舒</div>
      <div class="meta" style="margin-top:6px">你 的 小 说 工 坊</div>
    </header>

    <nav class="lib-tabs" id="tabs">
      <button data-f="writing" aria-selected="true">在写</button>
      <button data-f="completed" aria-selected="false">已完结</button>
      <button data-f="drafts" aria-selected="false">闪念</button>
      <button data-f="all" aria-selected="false">全部</button>
    </nav>

    <div id="list" style="padding: var(--s-6) var(--s-5) var(--s-9);">
      <div class="empty-state">
        <div class="glyph mincho">文</div>
        <p class="hint">还没有立项中的小说。<br>书房的第一部，是空白也可以。</p>
        <a href="onboard.html" class="btn-quiet vermilion" style="display: inline-block; margin-top: var(--s-3);">起 一 部 新 的</a>
      </div>
    </div>
  </div>

  <a class="drift-action" href="capture.html">
    <span class="glyph mincho">闪</span>
    <span class="lbl">念</span>
  </a>

  <script type="module">
    import { listNovels, listDrafts, deleteNovel } from '../js/store.js';
    import { confirmDialog, toast, cnWordCount, vibrate, bindGlobalTapVibration } from '../js/utils.js';

    bindGlobalTapVibration();

    const tabs = document.getElementById('tabs');
    const list = document.getElementById('list');
    let filter = 'writing';

    function statusChip(n) {
      if (n.status === 'completed') return '<span class="chip sealed">已封缄</span>';
      if (n.status === 'writing') return '<span class="chip writing">writing</span>';
      if (n.status === 'validating') return '<span class="chip done">校验中</span>';
      if (n.status === 'planning') return '<span class="chip pending">planning</span>';
      return '<span class="chip">'+n.status+'</span>';
    }

    function totalWords(n) {
      return n.chapters.reduce((s, c) => s + (c.wordCount || 0), 0);
    }
    function completedCount(n) {
      return n.chapters.filter((c) => c.status === 'completed').length;
    }

    function renderNovel(n) {
      const done = completedCount(n);
      const total = n.chapters.length || n.spec?.chapters || 0;
      const pct = total ? Math.round(done / total * 100) : 0;
      const wc = totalWords(n);
      const wcLabel = wc > 10000 ? `${(wc / 10000).toFixed(1)} 万字` : `${wc.toLocaleString()} 字`;
      const linkPrimary = n.status === 'planning' ? `plan.html?novel=${n.id}` : (n.status === 'completed' ? `reader.html?novel=${n.id}` : `editor.html?novel=${n.id}&ch=${n.currentChapter || 1}`);
      const tone = n.spec?.viewpoint ? `${n.spec.viewpoint}` : (n.spec?.protagonist || '');
      return `
        <div class="project-card" style="--p: ${pct}%">
          <a href="${linkPrimary}" style="display: block; text-decoration: none;">
            <div class="pc-kicker">
              <span>${n.spec?.genre || '未定题材'}</span>
              ${tone ? `<span class="sep">·</span><span>${tone}</span>` : ''}
              <span class="sep">·</span>${statusChip(n)}
            </div>
            <h2>《${n.title}》</h2>
            <p class="pc-logline">${n.spec?.logline || n.spec?.creative || '（暂无简介）'}</p>
            <div class="pc-progress">
              <span>${n.status === 'planning' ? '大纲已生成' : `第 ${n.currentChapter || done} / ${total} 章`}</span>
              <span class="bar"></span>
              <span>${n.status === 'planning' ? '待开笔' : wcLabel}</span>
            </div>
          </a>
          <div class="card-actions">
            <a href="reader.html?novel=${n.id}">阅 读</a>
            <a href="plan.html?novel=${n.id}">谋 篇</a>
            <a href="export.html?novel=${n.id}">导 出</a>
            <a class="danger" data-del="${n.id}" data-title="${n.title}" href="#">删 除</a>
          </div>
        </div>
      `;
    }

    function renderDraft(d) {
      const date = new Date(d.createdAt).toLocaleString('zh-CN', { hour12: false });
      return `
        <div class="project-card" style="border-bottom:1px solid var(--paper-edge); padding-bottom: var(--s-4);">
          <div class="pc-kicker">
            <span>闪念</span>
            ${d.tag ? `<span class="sep">·</span><span>${d.tag}</span>` : ''}
            ${d.belongsTitle ? `<span class="sep">·</span><span>${d.belongsTitle}</span>` : ''}
          </div>
          <p class="pc-logline" style="color: var(--ink); font-size: 16px; line-height: 1.95; margin: 0 0 var(--s-3);">${d.text}</p>
          <div class="card-actions">
            <span>${date}</span>
            <a class="danger" data-del-draft="${d.id}" href="#">扔 掉</a>
          </div>
        </div>
      `;
    }

    function render() {
      const novels = listNovels();
      const drafts = listDrafts();

      let items = [];
      if (filter === 'writing') items = novels.filter((n) => ['writing', 'planning', 'validating'].includes(n.status));
      else if (filter === 'completed') items = novels.filter((n) => n.status === 'completed');
      else if (filter === 'all') items = novels;
      else if (filter === 'drafts') {
        if (drafts.length === 0) {
          list.innerHTML = `<div class="empty-state"><div class="glyph mincho">闪</div><p class="hint">没有闪念落在书房里。<br>路上的句子、夜半的修订，先记下。</p><a href="capture.html" class="btn-quiet">现 在 记 一 条</a></div>`;
          return;
        }
        list.innerHTML = drafts.map(renderDraft).join('');
        bindDraftDeletes();
        return;
      }

      if (!items.length) {
        if (filter === 'completed') {
          list.innerHTML = `<div class="empty-state"><div class="glyph mincho">封</div><p class="hint">还没有完结的小说。<br>每一部都会有一个章末，慢慢来。</p></div>`;
        } else {
          list.innerHTML = `<div class="empty-state"><div class="glyph mincho">文</div><p class="hint">还没有立项中的小说。<br>书房的第一部，是空白也可以。</p><a href="onboard.html" class="btn-quiet vermilion">起 一 部 新 的</a></div>`;
        }
        return;
      }

      list.innerHTML = items.map(renderNovel).join('') + `
        <a href="onboard.html" style="display:block;text-align:center;padding:var(--s-7) 0 var(--s-5);
                font-family:var(--font-mincho);font-size:15px;letter-spacing:0.12em;
                color:var(--ink-faint);border-top:1px solid var(--paper-edge);
                margin-top:var(--s-3); text-decoration: none;">
          起 一 部 新 的
          <span style="display:block;font-family:var(--font-mono);font-size:10px;
                       letter-spacing:0.32em;color:var(--ink-ghost);margin-top:6px;">
            NEW · 立项
          </span>
        </a>
      `;

      bindNovelDeletes();
    }

    function bindNovelDeletes() {
      list.querySelectorAll('[data-del]').forEach((a) => {
        a.onclick = async (e) => {
          e.preventDefault();
          vibrate('warn');
          const ok = await confirmDialog(`封存《${a.dataset.title}》？章节正文与大纲都会被删除——此操作不可撤销。`, { okLabel: '确认删除' });
          if (!ok) return;
          deleteNovel(a.dataset.del);
          vibrate('long');
          toast('已 删 除');
          render();
        };
      });
    }
    function bindDraftDeletes() {
      list.querySelectorAll('[data-del-draft]').forEach((a) => {
        a.onclick = async (e) => {
          e.preventDefault();
          vibrate('tap');
          const { removeDraft } = await import('../js/store.js');
          removeDraft(a.dataset.delDraft);
          render();
        };
      });
    }

    tabs.querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        vibrate('tap');
        filter = b.dataset.f;
        tabs.querySelectorAll('button').forEach((bb) => bb.setAttribute('aria-selected', bb.dataset.f === filter ? 'true' : 'false'));
        render();
      };
    });

    render();
  </script>
</body>
</html>
