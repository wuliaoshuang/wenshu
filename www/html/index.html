<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>文舒 · WENSHU</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<script type="module" src="../js/boot.js"></script>
<style>
  html, body { width: 100%; min-height: 100%; }
  body { background: var(--paper); }
</style>
</head>
<body class="index-page">
  <section class="index-hero">
    <img class="hero-icon" src="../assets/wenshu_icon.png" alt="文舒">
    <p class="sub">WENSHU · 一座替你听落笔声音的小说工坊</p>
    <p class="signature">v 5.15 · POWERED BY DEEPSEEK</p>
  </section>

  <section class="entry-grid">
    <a class="entry-card" href="roleplay.html">
      <span class="entry-glyph mincho">笔</span>
      <div class="entry-copy">
        <h3>角 色 扮 演</h3>
        <p>纯语C。不规划，不弹卡，只接戏。</p>
      </div>
    </a>
    <a class="entry-card" href="agent.html">
      <span class="entry-glyph mincho">墨</span>
      <div class="entry-copy">
        <h3>墨 小 · Agent</h3>
        <p>说话就行。聊天里把小说从无到有捋出来——AI 自己判断该问什么、该写什么。</p>
      </div>
    </a>
    <a class="entry-card" href="library.html">
      <span class="entry-glyph mincho">纸</span>
      <div class="entry-copy">
        <h3>文 舒</h3>
        <p>正式作品的入口。进去后选择回书房继续写，或立一部新的。</p>
      </div>
    </a>
    <a class="entry-card" href="settings.html">
      <span class="entry-glyph mincho">砚</span>
      <div class="entry-copy">
        <h3>设 置</h3>
        <p>DeepSeek API Key、模型、写作偏好。每部小说立项时会先猜你的口味。</p>
      </div>
    </a>
  </section>

  <footer class="index-foot">
    <a href="capture.html">闪 念</a>
    <span class="dot">·</span>
    <a href="about.html">关 于 文 舒</a>
  </footer>

  <script type="module">
    import { getPrefs } from '../js/store.js';
    import { bindGlobalTapVibration } from '../js/utils.js';
    bindGlobalTapVibration();
    if (!getPrefs().apiKey) {
      const tip = document.createElement('div');
      tip.style.cssText = 'max-width: 720px; margin: 0 auto var(--s-5); padding: 0 var(--s-6);';
      tip.innerHTML = `<div style="border:1px dashed var(--paper-edge); padding: 14px 16px; font-family: var(--font-mincho); font-size: 13px; color: var(--ink-faint); letter-spacing: 0.04em; line-height: 1.85;">
        提醒：还未填 DeepSeek API Key。<a href="settings.html" style="color: var(--vermilion); border-bottom: 1px solid var(--vermilion);">现在去填 →</a>
      </div>`;
      document.body.appendChild(tip);
    }
  </script>
</body>
</html>
